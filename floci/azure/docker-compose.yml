version: "3.9"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: azurite
    restart: unless-stopped
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--location", "/data", "--debug", "/data/debug.log"]
    volumes:
      - azurite_data:/data
    environment:
      AZURITE_ACCOUNTS: local:miclave
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/local"]
      interval: 15s
      timeout: 5s
      retries: 5

# Conexion desde cliente:
#   AccountName: local
#   AccountKey:   miclave
#   BlobEndpoint: http://localhost:10000/local

volumes:
  azurite_data:
    driver: local