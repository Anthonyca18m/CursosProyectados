version: '3.8'

services:
  # ========================
  # RABBITMQ + Management UI
  # ========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # Puerto AMQP (para tu código)
      - "15672:15672"  # Management UI (GUI web)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # ========================
  # ZOOKEEPER (necesario para Kafka)
  # ========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  # ========================
  # KAFKA Broker
  # ========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"    # Puerto Kafka (para tu código)
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    restart: unless-stopped

  # ========================
  # KAFKA UI (AKHQ - moderna y gratuita)
  # ========================
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8080:8080"  # GUI de Kafka
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              connect:
                - name: docker-kafka
                  address: http://kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  # ========================
  # ALTERNATIVA: Conduktor UI (más completa, pero más pesado)
  # ========================
  # conduktor:
  #   image: conduktor/conduktor:latest
  #   container_name: conduktor
  #   ports:
  #     - "8090:8080"
  #   environment:
  #     CDKT_KAFKA_CLUSTERS_0_ID: docker-kafka
  #     CDKT_KAFKA_CLUSTERS_0_NAME: Local Kafka
  #     CDKT_KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #   depends_on:
  #     - kafka
  #   restart: unless-stopped

volumes:
  rabbitmq_data: