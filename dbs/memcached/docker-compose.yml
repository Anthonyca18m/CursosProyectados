version: "3.9"

services:
  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    command: ["memcached", "-m", "64", "-p", "11211"]
    # Nota: Memcached no soporta autenticacion nativa de usuario/contraseña.
    # Se usa solo como cache, sin persistencia de datos.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 10s
      timeout: 5s
      retries: 5

# Sin volumen persistente porque Memcached es puramente cache en memoria.