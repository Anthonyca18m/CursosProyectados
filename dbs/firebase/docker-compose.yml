version: "3.9"

services:
  firebase:
    image: node:18-alpine
    container_name: firebase-emulator
    restart: unless-stopped
    ports:
      - "4000:4000"   # Emulator Suite UI
      - "5001:5001"   # Functions
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
      - "9000:9000"   # Realtime Database
    working_dir: /opt/firebase
    volumes:
      - firebase_data:/opt/firebase/data
    command: >
      sh -c "
        npm install -g firebase-tools &&
        mkdir -p /opt/firebase &&
        cd /opt/firebase &&
        firebase init emulators --project demo-project --yes &&
        echo '{\"emulators\":{\"auth\":{\"port\":9099},\"firestore\":{\"port\":8080},\"database\":{\"port\":9000},\"ui\":{\"enabled\":true,\"port\":4000}}}' > firebase.json &&
        firebase emulators:start --import=/opt/firebase/data --export-on-exit
      "
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 10

# Nota: El emulador no usa autenticacion real. Para pruebas puedes crear usuarios con:
# local@example.com / miclave  (usando Admin SDK o UI)
volumes:
  firebase_data:
    driver: local