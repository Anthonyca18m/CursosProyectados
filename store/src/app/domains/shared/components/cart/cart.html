<div
  class="fixed border-l-4 border-gray-300 top-0 right-0 bg-red z-40 w-72 h-screen p-4
    overflow-y-auto transition-transform bg-white translate-x-full"
  [class.translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <div class="flex justify-between items-center">
    <p class="text-xl">My Cart</p>
    <button (click)="closeCart()" class="p-2 hover:bg-gray-200 rounded">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <div class="mt-4">
    @if (cart.length === 0) {
      <p>Your cart is empty.</p>
    } @else {
      <ul>
        @for (item of cart; track item) {
          <li class="card ps-2 py-2 flex flex-row items-center space-x-4 mb-4 border pb-2 border-gray-300">
            <img [src]="item.img" class="h-12 w-12 object-cover rounded" />
            <div>
              <p class="font-semibold">{{ item.name }}</p>
              <p class="text-sm text-gray-600">{{ item.price }}</p>
            </div>
          </li>
        }
      </ul>
    }
  </div>

  <div class="mt-4 border-t border-gray-300 pt-4">
    <p class="font-bold">Total: {{ cartTotalFormat }}</p>
  </div>
</div>
