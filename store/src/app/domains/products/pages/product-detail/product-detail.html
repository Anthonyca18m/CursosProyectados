<div class="w-full flex space-x-10">
  <div class="flex flex-col w-1/3">
      <div class="w-full rounded border border-gray-200">
        <img
          [alt]="productDetail()?.title"
          class="w-full object-cover object-center"
          [src]="coverImg()"
        />
      </div>
    <div class="flex items-center justify-center mt-1">
      <div class="grid grid-cols-3 gap-1">
        @for (item of productDetail()?.images; track $index) {
          <img
            alt="ecommerce"
            class="w-full h-20 object-cover object-center border border-gray-200 rounded cursor-pointer"
            [src]="item"
            (click)="setConverImg(item)"
          />
        }
      </div>
    </div>
  </div>
  <div class="mt-5 w-full">
    <h2 class="text-sm title-font text-gray-500 tracking-widest">{{ productDetail()?.category?.name }}</h2>
    <h1 class="text-gray-900 text-3xl title-font font-medium mb-1">
      {{ productDetail()?.title }}
    </h1>
    <p class="leading-relaxed">
      {{ productDetail()?.description }}
    </p>
    <p class="title-font font-medium text-2xl text-gray-900 my-5">{{ productDetail()?.price | currency:'USD':'symbol' }}</p>
    <button
      class="flex text-white bg-red-500 border-0 py-2 px-6 focus:outline-none hover:bg-red-600 rounded"
    >
      Add To Cart
    </button>
  </div>
</div>
